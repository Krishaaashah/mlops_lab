data:
  dataset_name: fashion_mnist
  processed_data_path: data/processed

model:
  image_size: 28
  batch_size: 32
  epochs: 10
  learning_rate: 0.001
  optimizer: adam
  dropout_rate: 0.5
  validation_split: 0.2
  random_seed: 42

output:
  model_path: models/model.keras

augmentation:
  rotation: 10
  zoom: 0.1
  horizontal_flip: false